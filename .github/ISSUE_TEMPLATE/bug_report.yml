name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: GerGit version
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop and display server
      options:
        - GNOME / Wayland
        - GNOME / X11
        - KDE / Wayland
        - KDE / X11
        - Other
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: git version
      description: Output of `git --version`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include screenshots or output if useful.
    validations:
      required: true
